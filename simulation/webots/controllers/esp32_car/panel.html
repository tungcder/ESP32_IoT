<style>
  #sim-panel { width: min(100% - 32px, 760px); margin: 0 auto 32px; padding: 18px 21px;
    border: 1px solid #2d424d; border-radius: 20px; background: #111e27; color: #eef5fa;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
  #sim-panel h2 { margin: 0 0 8px; font-size: 19px; }
  #sim-values { margin: 0; color: #a9bdca; font: 13px/1.7 ui-monospace, Consolas, monospace; white-space: pre-line; }
</style>
<aside id="sim-panel">
  <h2>Thông tin mô phỏng Webots</h2>
  <p id="sim-values">Đang kết nối…</p>
</aside>
<script>
(() => {
  const values = document.getElementById('sim-values');
  async function poll() {
    try {
      const response = await fetch('/state', {cache: 'no-store', signal: AbortSignal.timeout(2000)});
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const state = await response.json();
      values.textContent = 'Chế độ: ' + state.drive_mode + '\n'
        + 'Chuyển động: ' + state.movement + '\n'
        + 'PWM động cơ: ' + state.speed_percent + '%\n'
        + 'Khoảng cách: ' + state.distance_cm + ' cm\n'
        + 'Góc cảm biến: ' + state.scanner_angle_deg + '°\n'
        + 'Bước AUTO: ' + state.auto_state + '\n'
        + 'Thời gian mô phỏng: ' + state.sim_time.toFixed(2) + ' s';
    } catch (_) {
      values.textContent = 'Mất kết nối Webots.';
    }
    setTimeout(poll, 500);
  }
  poll();
})();
</script>
