[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<l298n_test.cpp>
lib_deps =
    madhephaestus/ESP32Servo

[env:l298n_test]
extends = env:esp32dev
build_src_filter = -<*> +<l298n_test.cpp>
